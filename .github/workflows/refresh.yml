# Engine-repo refresh.yml candidate (Route B). Diff vs live:
#  - adds cache restore before generation and KV publish after (replaces git content commit)
#  - drops `permissions: contents: write` -> contents: read (no commits at all)
#  - generate.py in the engine repo carries the redacted logging (generate-redacted.py)
#  - no content-bearing file is committed or printed; logs stay operational only
name: Refresh scanners
on:
  schedule:
    - cron: '7-59/15 * * * *'  # phase-offset from 500scanners so the two parallel-phase writers never overlap
  workflow_dispatch:
    inputs:
      force_news:
        description: 'Rescan news now, bypassing the hourly gate'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore pipeline caches from KV
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse
          base = os.environ['PUBLISH_URL']
          key = os.environ['PUBLISH_KEY']
          caches = ['bio_hot.json','news_latest.json','cnn_snapshot.json',
                    'clinical_trials_cache.json','biotech_breakthroughs_cache.json',
                    'sp500_tickers_cache.json','sp500_names_cache.json','recovery_history.json',
                    'biotech_config.json','biotech_universe.json','biotech_catalysts.json',
                    'biotech_trials.json','market_scanner_universe.json','accuracy_stats.json']
          H = {'x-publish-key': key, 'User-Agent': 'scanner-refresh/1.0'}
          # Coherent restore: one bundle GET (single atomic snapshot), fallback to per-key GETs
          restored = set()
          try:
              req = urllib.request.Request(base + '?key=' + urllib.parse.quote('site:bundle'), headers=H)
              with urllib.request.urlopen(req, timeout=60) as r:
                  bundle = json.loads(r.read().decode('utf-8'))
              for name in caches:
                  k = 'cache:' + name
                  if k in bundle.get('files', {}):
                      with open(name, 'w', encoding='utf-8') as f:
                          json.dump(bundle['files'][k], f, ensure_ascii=False)
                      restored.add(name)
              if restored:
                  print('cache restore: bundle epoch', bundle.get('epoch'), '-', len(restored), 'files, coherent snapshot')
          except urllib.error.HTTPError as e:
              if e.code != 404:
                  raise
              print('cache restore: no bundle yet, falling back to per-key GETs')
          for name in caches:
              if name in restored:
                  continue
              url = base + '?key=' + urllib.parse.quote('cache:' + name)
              req = urllib.request.Request(url, headers=H)
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = r.read()
                  with open(name, 'wb') as f:
                      f.write(data)
                  print('cache restored:', name, len(data), 'bytes')
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      print('cache absent (cold start):', name)
                  else:
                      raise
          PYEOF
      - name: Linked market news (hourly; force only on explicit manual request)
        run: python news_pulse.py ${{ inputs.force_news == true && '--force' || '' }}
      - run: python generate.py
      - name: Publish site + caches to KV
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request, urllib.parse
          base = os.environ['PUBLISH_URL']
          key = os.environ['PUBLISH_KEY']
          H = {'x-publish-key': key, 'User-Agent': 'scanner-refresh/1.0'}
          # Freshness guard: read the AUTHORITATIVE bundle's epoch; skip if KV holds newer
          try:
              vreq = urllib.request.Request(base + '?key=' + urllib.parse.quote('site:bundle'), headers=H)
              with urllib.request.urlopen(vreq, timeout=60) as r:
                  kv_epoch = json.loads(r.read().decode('utf-8')).get('epoch', 0)
          except urllib.error.HTTPError as e:
              if e.code == 404:
                  kv_epoch = 0
              else:
                  raise
          local_version = json.load(open('version.json', encoding='utf-8'))
          local_epoch = local_version.get('epoch', 0)
          if kv_epoch > local_epoch:
              print('SKIP publish: KV holds newer snapshot')
              raise SystemExit(0)
          uploads = [('index.html', 'site:index.html'), ('version.json', 'site:version.json')]
          for name in ['bio_hot.json','news_latest.json','cnn_snapshot.json',
                       'clinical_trials_cache.json','biotech_breakthroughs_cache.json',
                       'sp500_tickers_cache.json','sp500_names_cache.json','recovery_history.json',
                       'biotech_config.json','biotech_universe.json','biotech_catalysts.json',
                       'biotech_trials.json','market_scanner_universe.json','accuracy_stats.json']:
              if os.path.exists(name):
                  uploads.append((name, 'cache:' + name))
          files = {}
          for path, k in uploads:
              if k.endswith('.json'):
                  files[k] = json.load(open(path, encoding='utf-8'))
              else:
                  files[k] = open(path, encoding='utf-8').read()
          # Atomic publication: ONE bundle PUT swaps the whole snapshot coherently
          bundle = json.dumps({'epoch': local_epoch, 'files': files}, ensure_ascii=False, separators=(',', ':'))
          def put(k, body):
              url = base + '?key=' + urllib.parse.quote(k)
              req = urllib.request.Request(url, data=body.encode('utf-8'), method='POST',
                                           headers=dict(H, **{'Content-Type': 'application/octet-stream'}))
              with urllib.request.urlopen(req, timeout=120) as r:
                  if r.status != 200:
                      raise SystemExit('publish failed for ' + k + ': HTTP ' + str(r.status))
          put('site:bundle', bundle)
          # post-write convergence check: if a concurrent newer writer won, report it
          try:
              creq = urllib.request.Request(base + '?key=' + urllib.parse.quote('site:bundle'), headers=H)
              with urllib.request.urlopen(creq, timeout=60) as r:
                  stored_epoch = json.loads(r.read().decode('utf-8')).get('epoch', 0)
              if stored_epoch != local_epoch:
                  print('NOTE: stored bundle epoch', stored_epoch, '!= own', local_epoch, '- concurrent writer; newer snapshot wins by guard on next run')
              else:
                  print('published: site:bundle', len(bundle), 'bytes,', len(files), 'files, epoch', local_epoch)
          except Exception as e:
              print('post-write check failed (non-fatal):', type(e).__name__)
          PYEOF
