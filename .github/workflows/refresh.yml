# Engine-repo refresh.yml candidate (Route B). Diff vs live:
#  - adds cache restore before generation and KV publish after (replaces git content commit)
#  - drops `permissions: contents: write` -> contents: read (no commits at all)
#  - generate.py in the engine repo carries the redacted logging (generate-redacted.py)
#  - no content-bearing file is committed or printed; logs stay operational only
name: Refresh scanners
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_news:
        description: 'Rescan news now, bypassing the hourly gate'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Restore pipeline caches from KV
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
        run: |
          python3 - <<'PYEOF'
          import os, urllib.request, urllib.parse
          base = os.environ['PUBLISH_URL']
          key = os.environ['PUBLISH_KEY']
          caches = ['bio_hot.json','news_latest.json','cnn_snapshot.json',
                    'clinical_trials_cache.json','biotech_breakthroughs_cache.json',
                    'sp500_tickers_cache.json','sp500_names_cache.json','recovery_history.json',
                    'biotech_config.json','biotech_universe.json','biotech_catalysts.json',
                    'biotech_trials.json','market_scanner_universe.json','accuracy_stats.json']
          for name in caches:
              url = base + '?key=' + urllib.parse.quote('cache:' + name)
              req = urllib.request.Request(url, headers={'x-publish-key': key, 'User-Agent': 'scanner-refresh/1.0'})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      data = r.read()
                  with open(name, 'wb') as f:
                      f.write(data)
                  print('cache restored:', name, len(data), 'bytes')
              except urllib.error.HTTPError as e:
                  if e.code == 404:
                      print('cache absent (cold start):', name)
                  else:
                      raise
          PYEOF
      - name: Linked market news (hourly; force only on explicit manual request)
        run: python news_pulse.py ${{ inputs.force_news == true && '--force' || '' }}
      - run: python generate.py
      - name: Publish site + caches to KV
        env:
          PUBLISH_KEY: ${{ secrets.PUBLISH_KEY }}
          PUBLISH_URL: ${{ secrets.PUBLISH_URL }}
        run: |
          python3 - <<'PYEOF'
          import os, urllib.request, urllib.parse
          base = os.environ['PUBLISH_URL']
          key = os.environ['PUBLISH_KEY']
          # Freshness guard: if KV already holds a strictly newer snapshot, skip publishing
          try:
              vreq = urllib.request.Request(base + '?key=' + urllib.parse.quote('site:version.json'),
                                            headers={'x-publish-key': key, 'User-Agent': 'scanner-refresh/1.0'})
              with urllib.request.urlopen(vreq, timeout=30) as r:
                  import json as _j
                  kv_epoch = _j.loads(r.read().decode('utf-8')).get('epoch', 0)
          except urllib.error.HTTPError as e:
              kv_epoch = 0 if e.code == 404 else (_ for _ in ()).throw(e)
          import json as _j2
          local_epoch = _j2.load(open('version.json', encoding='utf-8')).get('epoch', 0)
          if kv_epoch > local_epoch:
              print('SKIP publish: KV holds newer snapshot')
              raise SystemExit(0)
          uploads = [('index.html', 'site:index.html'), ('version.json', 'site:version.json')]
          for name in ['bio_hot.json','news_latest.json','cnn_snapshot.json',
                       'clinical_trials_cache.json','biotech_breakthroughs_cache.json',
                       'sp500_tickers_cache.json','sp500_names_cache.json','recovery_history.json',
                       'biotech_config.json','biotech_universe.json','biotech_catalysts.json',
                       'biotech_trials.json','market_scanner_universe.json','accuracy_stats.json']:
              if os.path.exists(name):
                  uploads.append((name, 'cache:' + name))
          for path, k in uploads:
              with open(path, 'rb') as f:
                  data = f.read()
              url = base + '?key=' + urllib.parse.quote(k)
              req = urllib.request.Request(url, data=data, method='POST',
                                           headers={'x-publish-key': key,
                                                    'Content-Type': 'application/octet-stream',
                                                    'User-Agent': 'scanner-refresh/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  if r.status != 200:
                      raise SystemExit('publish failed for ' + k + ': HTTP ' + str(r.status))
              print('published:', k, len(data), 'bytes')
          PYEOF
